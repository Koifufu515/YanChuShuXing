<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5fcc">
  <title>言出数行 · 候选前端</title>
  <link rel="manifest" href="/candidate/assets/manifest.webmanifest">
  <link rel="icon" href="/candidate/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/candidate/assets/styles.css">
</head>
<body>
  <div id="candidate-banner" class="candidate-banner">候选版 · 验收通过前不替代现有 Streamlit 回退版</div>
  <main class="workbench" data-testid="three-column-workbench" aria-label="三栏式 AI 数据分析工作台">
    <aside id="conversation-drawer" class="left-rail" data-testid="left-rail" aria-label="会话与导航">
      <header class="brand"><span class="brand-mark">言</span><div><strong>言出数行</strong><small>银行智能问数</small></div><button class="drawer-close" type="button" data-close-drawer aria-label="关闭会话抽屉">×</button></header>
      <button id="new-chat" class="primary wide" type="button"><span>＋</span> 新建会话</button>
      <nav aria-label="主要功能">
        <button class="nav-item active" type="button" data-page="chat"><span>◫</span>聊天分析</button>
        <button class="nav-item" type="button" data-page="dashboard"><span>▦</span>数据看板</button>
      </nav>
      <section class="history-head"><strong>历史会话</strong><span id="history-count">0</span></section>
      <label class="search"><span>⌕</span><input id="history-search" type="search" placeholder="检索历史会话" autocomplete="off" aria-label="检索历史会话"></label>
      <div id="history-list" class="history-list" aria-live="polite"></div>
      <details class="privacy-note"><summary>隐私说明</summary><p>历史会话仅保存在当前浏览器。本地历史不等同于银行级服务端审计，问数接口响应不会由 Service Worker 缓存。</p></details>
      <footer class="user-card"><span class="avatar">U</span><div><strong>比赛演示用户</strong><small>安全状态以服务端返回为准</small></div></footer>
    </aside>

    <section class="center-panel" data-testid="chat-panel">
      <header class="panel-head"><div class="mobile-toolbar"><button id="open-conversations" class="ghost drawer-trigger" type="button" aria-expanded="false" aria-controls="conversation-drawer">会话</button></div><div class="panel-title"><h1 id="page-title">新会话</h1><p id="page-subtitle">用自然语言查询银行经营数据</p></div><div class="panel-actions"><button id="head-new-chat" class="ghost" type="button">＋ 新建会话</button><button id="open-details" class="ghost drawer-trigger" type="button" aria-expanded="false" aria-controls="detail-drawer">详情</button></div></header>
      <div id="chat-view" class="chat-view">
        <div id="message-scroll" class="message-scroll" data-testid="message-scroll"></div>
        <form id="composer" class="composer" data-testid="fixed-composer">
          <textarea id="question" rows="1" maxlength="500" placeholder="输入银行经营分析问题，按 Enter 发送……" aria-label="输入问题"></textarea>
          <button id="send" class="send" type="submit" aria-label="发送问题">↑</button>
          <p>回答来自真实查询；按 Shift + Enter 换行</p>
        </form>
      </div>
      <div id="dashboard-view" class="dashboard-view" hidden></div>
    </section>

    <aside id="detail-drawer" class="detail-panel" data-testid="detail-panel" aria-label="执行详情">
      <header class="detail-head"><div><h2>执行详情</h2><p>当前选中的 AI 回答</p></div><div class="detail-head-actions"><span id="detail-status" class="status-chip">未查询</span><button class="drawer-close" type="button" data-close-drawer aria-label="关闭详情抽屉">×</button></div></header>
      <div id="detail-content" class="detail-content"></div>
    </aside>
  </main>
  <button id="drawer-scrim" class="drawer-scrim" type="button" aria-label="关闭抽屉" tabindex="-1"></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/candidate/assets/echarts.min.js" defer></script>
  <script src="/candidate/assets/result_adapter.js" defer></script>
  <script src="/candidate/assets/app.js" defer></script>
</body>
</html>
